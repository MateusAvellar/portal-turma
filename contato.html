<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Fale Conosco</title>
</head>

<body>

<h1>Fale Conosco</h1>

<form>

<label>Nome:</label>
<br>
<input type="text" name="nome">
<br><br>

<label>E-mail:</label>
<br>
<input type="email" name="email">
<br><br>

<label>Curso / Disciplina:</label>
<br>
<select name="curso">

<option>Desenvolvimento Front-End</option>
<option>Programação em C</option>
<option>Banco de Dados</option>

</select>

<br><br>

<label>Mensagem:</label>
<br>
<textarea name="mensagem" rows="5" cols="30"></textarea>

<br><br>

<button type="submit">Enviar</button>

</form>

<br>

<a href="index.html">Voltar para a página inicial</a>

</body>
</html>
